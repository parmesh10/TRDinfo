<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TRD Examination | TRDinfo</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
        }

        .header {
            background: #0b3d62;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .back {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 650px;
            margin: 60px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        h1 {
            color: #0b3d62;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            margin-bottom: 22px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #0b3d62;
        }

        .exam-info {
            background: #eff6ff;
            border-left: 4px solid #0b3d62;
            padding: 18px;
            margin-bottom: 25px;
            border-radius: 5px;
        }

        .exam-info p {
            margin: 7px 0;
            color: #475569;
        }

        .start-btn {
            width: 100%;
            padding: 15px;
            background: #0b3d62;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .start-btn:hover {
            background: #155e75;
        }

        .warning {
            margin-top: 20px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
        }

    </style>

</head>

<body>

<header class="header">

    <div class="logo">
        🚆 TRDinfo
    </div>

    <a href="/" class="back">
        ← Home
    </a>

</header>


<div class="container">

    <div class="card">

        <h1>
            📝 TRD Examination
        </h1>

        <p class="subtitle">
            Enter your details before starting the examination
        </p>


        <div class="exam-info">

            <p>
                <strong>Examination:</strong>
                {{ exam.name }}
            </p>

           <!--<p>
                <strong>Questions:</strong>
                {{ exam.number_of_questions }}
            </p>-->

            <p>
                <strong>Duration:</strong>
                {{ exam.duration_minutes }} minutes
            </p>

            <p>
                <strong>Pass Percentage:</strong>
                {{ exam.pass_percentage }}%
            </p>

        </div>


        <form method="POST">

            {% csrf_token %}


            <label for="candidate_name">
                Candidate Name
            </label>

            <input
                type="text"
                id="candidate_name"
                name="candidate_name"
                placeholder="Enter your full name"
                required
            >


            <label for="employee_number">
                Employee Number
            </label>

            <input
                type="text"
                id="employee_number"
                name="employee_number"
                placeholder="Enter employee number"
                required
            >


            <button
                type="submit"
                class="start-btn">
                START EXAM
            </button>

        </form>


        <p class="warning">
            ⚠ Once the examination starts, the timer will begin.
        </p>

    </div>

</div>

</body>

</html>
